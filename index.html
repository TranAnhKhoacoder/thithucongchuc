                      <div className="relative w-full h-[400px] bg-slate-950 rounded-xl overflow-hidden border border-slate-800 flex items-center justify-center">
                        <svg className="absolute inset-0 w-full h-full opacity-70" viewBox="0 0 600 400">
                          <path d="M 50,350 C 150,300 180,240 250,220 C 320,200 380,180 480,160 C 520,150 560,110 590,50" fill="none" stroke="#38bdf8" strokeWidth="8"/>
                        </svg>
                        {HOTSPOTS.map((spot) => (
                          <div key={spot.id} style={{ left: `${spot.x}%`, top: `${spot.y}%` }} className="absolute transform -translate-x-1/2 -translate-y-1/2">
                            <span className="relative flex h-4 w-4 items-center justify-center">
                              <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"></span>
                              <span className="relative inline-flex rounded-full h-3 w-3 bg-red-500"></span>
                            </span>
                          </div>
                        ))}
                      </div>
                    </div>
                    <div className="bg-slate-900 border border-slate-800 rounded-2xl p-5">
                      <h3 className="text-base font-bold text-white mb-3">Trạm Thủy Văn TP Huế</h3>
                      <div className="space-y-3">
                        {stations.map(s => (
                          <div key={s.id} className="p-3 bg-slate-950 border border-slate-800 rounded-xl">
                            <h4 className="font-bold text-slate-200 text-xs">{s.name}</h4>
                            <div className="mt-1 text-sm font-black text-cyan-300">Mực nước: {s.levelCm} cm</div>
                          </div>
                        ))}
                      </div>
                    </div>
                  </div>
                )}

                {/* TAB 3: DAMS */}
                {activeTab === 'dams' && (
                  <div className="bg-slate-900 border border-slate-800 rounded-2xl p-5">
                    <h3 className="text-lg font-bold text-white mb-4">Vận Hành Hồ Chứa Thủy Điện Thừa Thiên Huế</h3>
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                      {dams.map(dam => (
                        <div key={dam.id} className="bg-slate-950 border border-slate-800 rounded-xl p-4">
                          <h4 className="font-bold text-white text-base">{dam.name}</h4>
                          <div className="mt-2 space-y-1 text-xs text-slate-300">
                            <p>Sông: <span className="text-cyan-300">{dam.river}</span></p>
                            <p>Mực nước: <strong className="text-white">{dam.waterLevel} m</strong></p>
                            <p>Lưu lượng xả: <strong className="text-amber-400">{dam.outflow} m³/s</strong></p>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {/* TAB 4: SOS */}
                {activeTab === 'sos' && (
                  <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                    <div className="bg-slate-900 border border-slate-800 rounded-2xl p-5">
                      <h3 className="text-lg font-bold text-white mb-2">Kênh Cứu Hộ SOS & Phản Ánh Huế</h3>
                      {sosSubmitted && <div className="bg-emerald-950 text-emerald-300 p-3 rounded-xl mb-4 text-xs">✅ Đã gửi phản ánh thành công!</div>}
                      <form onSubmit={handleSosSubmit} className="space-y-3">
                        <input type="text" required placeholder="Họ và tên..." value={sosForm.name} onChange={e => setSosForm({...sosForm, name: e.target.value})} className="w-full bg-slate-950 border border-slate-800 p-2.5 rounded-lg text-xs text-white" />
                        <input type="tel" required placeholder="Số điện thoại..." value={sosForm.phone} onChange={e => setSosForm({...sosForm, phone: e.target.value})} className="w-full bg-slate-950 border border-slate-800 p-2.5 rounded-lg text-xs text-white" />
                        <input type="text" required placeholder="Địa điểm ngập cụ thể..." value={sosForm.location} onChange={e => setSosForm({...sosForm, location: e.target.value})} className="w-full bg-slate-950 border border-slate-800 p-2.5 rounded-lg text-xs text-white" />
                        <textarea rows="3" placeholder="Mô tả tình hình..." value={sosForm.description} onChange={e => setSosForm({...sosForm, description: e.target.value})} className="w-full bg-slate-950 border border-slate-800 p-2.5 rounded-lg text-xs text-white" />
                        <button type="submit" className="w-full bg-red-600 hover:bg-red-500 text-white font-bold py-2.5 rounded-lg text-xs">Gửi Phản Ánh</button>
                      </form>
                    </div>
                    <div className="bg-slate-900 border border-slate-800 rounded-2xl p-5">
                      <h3 className="text-base font-bold text-white mb-3">Cộng Đồng Phản Ánh</h3>
                      <div className="space-y-3">
                        {communityReports.map(rep => (
                          <div key={rep.id} className="p-3 bg-slate-950 border border-slate-800 rounded-xl text-xs space-y-1">
                            <strong className="text-cyan-300">{rep.user}</strong>
                            <p className="text-slate-300">📍 {rep.location}</p>
                            <p className="text-amber-400 font-semibold">Mức ngập: {rep.depth}</p>
                            <p className="text-slate-400">"{rep.desc}"</p>
                          </div>
                        ))}
                      </div>
                    </div>
                  </div>
                )}
              </main>

              {/* FOOTER */}
              <footer className="border-t border-slate-800 mt-12 py-6 bg-slate-950 text-slate-500 text-xs text-center">
                <p className="font-bold text-slate-300">HUEWEATHER — Theo dõi Thời tiết & Mực nước Sông Thành phố Huế</p>
                <p className="mt-1">Nhà phát triển: <strong className="text-cyan-400">Trần Anh Khoa</strong> | Nguồn dữ liệu: Ban chỉ huy phòng thủ dân sự TP. Huế</p>
              </footer>
            </div>
          );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
